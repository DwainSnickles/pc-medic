name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish Windows x64 release
    runs-on: windows-latest

    steps:
      - name: Checkout PC Medic at the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The console compiles Disk Defrag from source and the project lives in its own repo,
      # so the companion has to be on disk before PC Medic itself is published.
      - name: Checkout Disk Defrag companion
        uses: actions/checkout@v4
        with:
          repository: DwainSnickles/disk-defrag
          path: companion

      - name: Publish PC Medic
        run: >
          dotnet publish "PC Medic.csproj" -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -p:DiskDefragProject=companion\DiskDefrag.csproj
          -o staging/pcmedic

      - name: Publish Disk Defrag
        run: >
          dotnet publish "companion/DiskDefrag.csproj" -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -o staging/diskdefrag

      - name: Build the zips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts, staging/suite | Out-Null
          Copy-Item staging/pcmedic/*.exe staging/suite/ -Force
          Copy-Item staging/diskdefrag/*.exe staging/suite/ -Force
          Copy-Item README.md staging/suite/ -Force
          Compress-Archive -Path staging/suite/* -DestinationPath artifacts/PC-Medic-suite-win-x64.zip -Force
          Compress-Archive -Path staging/pcmedic/* -DestinationPath artifacts/PC-Medic-win-x64.zip -Force
          Compress-Archive -Path staging/diskdefrag/* -DestinationPath artifacts/Disk-Defrag-win-x64.zip -Force
          Get-ChildItem artifacts | Select-Object Name, Length

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          Write-Host "Releasing $tag"
          gh release create $tag artifacts/*.zip --title $tag --generate-notes --verify-tag
